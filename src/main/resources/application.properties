spring.application.name=backend_tesis


aws.accessKeyId=${AWS_ACCESS_KEY_ID:test}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:test}
aws.region=${AWS_DEFAULT_REGION:us-east-1}


#Puerto
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/API/tesis
auth.url=${AUTH_URL:http://autenticacion:8080/API/tesis/}
motor.url=${MOTOR_URL:http://motor-procesos:8080/API/tesis/}
correo.url=${CORREO_URL:http://correo:8080/API/tesis/}


spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/base_tesis}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

